name: Bootstrap StudioSplit

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

concurrency:
  group: studiosplit-bootstrap
  cancel-in-progress: true

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for complete payload
        id: payload
        shell: bash
        run: |
          if [[ -f .bootstrap/part-00 && -f .bootstrap/part-01 && -f .bootstrap/part-02 && -f .bootstrap/part-03 && -f .bootstrap/part-04 ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Unpack prepared repository
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/studiosplit.zip
          rm -rf /tmp/studiosplit-unpack
          mkdir -p /tmp/studiosplit-unpack
          unzip -q /tmp/studiosplit.zip -d /tmp/studiosplit-unpack
          cp -a /tmp/studiosplit-unpack/studiosplit-work/. .
          rm -rf .bootstrap
          rm -f apps/web/tsconfig.tsbuildinfo
          rm -f .github/workflows/bootstrap.yml
      - name: Commit prepared StudioSplit tree
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: build StudioSplit contract and frontend'
          git push origin HEAD:main
