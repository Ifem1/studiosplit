name: Publish StudioSplit source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Repair StudioSplit bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact source tree
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/fix.00a.b64 \
            .bootstrap/fix.00b.b64 \
            .bootstrap/tar.01.b64 \
            .bootstrap/tar.02.b64 \
            .bootstrap/tar.03.b64 \
            .bootstrap/fix.04a.b64 \
            .bootstrap/fix.04b.b64 \
            .bootstrap/tar.05.b64 \
            .bootstrap/tar.06.b64 \
            | base64 -d > /tmp/studiosplit.tar.xz
          echo "70f8113d593b8674cd63f9826ca4a092931e6cc324df326e016b196e4b22dee4  /tmp/studiosplit.tar.xz" | sha256sum -c -
          rm -rf .bootstrap
          tar -xJf /tmp/studiosplit.tar.xz -C .
          rm -f .github/workflows/bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish StudioSplit source tree"
          git push origin HEAD:main
